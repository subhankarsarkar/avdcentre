<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foods ads | Advertisement Centre</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Hind:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f6fa;--surface:#fff;--ink:#14213d;--muted:#55627a;--line:#d9e0ea;--accent:#f5a400;--accent-ink:#14213d;--c:#d9731a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--surface:#16213a;--ink:#eef2fa;--muted:#9fb0cc;--line:#2a3a5c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1626;--surface:#16213a;--ink:#eef2fa;--muted:#9fb0cc;--line:#2a3a5c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 Hind,system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.1}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.brand{font:800 1.15rem "Bricolage Grotesque",sans-serif;text-decoration:none}
.back{color:var(--muted);text-decoration:none;font-weight:500}
.back:hover{color:var(--ink)}
.hero{background:var(--c);color:#fff;border-radius:18px;padding:34px 28px;margin:6px 0 24px}
.hero h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:800;letter-spacing:-.02em}
.hero p{margin:10px 0 0;max-width:54ch;font-size:1.1rem}
.bar{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 14px;gap:12px;flex-wrap:wrap}
.bar h2{font-size:1.4rem}
.bar input{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font:500 1rem Hind,sans-serif;min-width:220px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;padding-bottom:36px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;color:inherit;font:inherit;display:flex;flex-direction:column}
.card:hover{border-color:var(--ink)}
.thumb{aspect-ratio:16/9;background:var(--c);position:relative;display:grid;place-items:center;color:#fff;overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb b{font:800 1.3rem "Bricolage Grotesque",sans-serif;text-align:center;padding:0 12px}
.play{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92)}
.play::after{content:"";position:absolute;left:13px;top:9px;border-left:12px solid #14213d;border-top:8px solid transparent;border-bottom:8px solid transparent}
.body{padding:12px 14px 15px}
.card h3{font-size:1.1rem}
.card p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.empty{grid-column:1/-1;padding:36px;border:2px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted)}
.more{border-top:1px solid var(--line);padding:22px 0 32px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.more a{border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;text-decoration:none;font-weight:600;background:var(--surface)}
.more a:hover{border-color:var(--ink)}
dialog{border:0;border-radius:16px;padding:0;width:min(720px,94vw);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(8,14,28,.7)}
.player{aspect-ratio:16/9;background:#000;display:grid;place-items:center;color:#fff;text-align:center}
.player video{width:100%;height:100%;display:block}
.player div{padding:20px;background:var(--c);width:100%;height:100%;display:grid;place-items:center}
.dbody{padding:14px 20px 20px}
.dbody h3{font-size:1.3rem}.dbody p{color:var(--muted);margin:6px 0 12px}
.btn{border:1.5px solid var(--ink);border-radius:10px;background:transparent;color:var(--ink);font:700 1rem "Bricolage Grotesque",sans-serif;padding:9px 18px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="index.html">Advertisement Centre</a>
    <a class="back" href="index.html">Back to all categories</a>
  </header>
  <section class="hero">
    <h1>Foods</h1>
    <p>Rice, tea, spices and snacks. See what different companies offer for your kitchen.</p>
  </section>
  <div class="bar">
    <h2 id="count"></h2>
    <input id="q" type="search" placeholder="Search company or product" aria-label="Search in Foods">
  </div>
  <div class="grid" id="grid"></div>
  <nav class="more" aria-label="Other categories"><span>More categories:</span><a href="transport.html">Transport</a></nav>
</div>

<dialog id="dlg" aria-label="Video advertisement">
  <div class="player" id="player"></div>
  <div class="dbody"><h3 id="dt"></h3><p id="dd"></p><button class="btn" id="close" type="button">Close</button></div>
</dialog>

<script>
var FOLDER="foods";
/* Add a new ad: one line here + thumbs/foods/N.png + videos/foods/N.mp4 */
var ADS=[["Sample Grains", "Long Grain Basmati", "Fluffy rice for every meal."], ["Sample Tea Estate", "Fresh Garden Tea", "Strong taste, rich colour."], ["Sample Spices", "Pure Turmeric Powder", "Bright colour, true aroma."], ["Sample Biscuits", "Crunchy Tea Biscuits", "Perfect with a hot cup of tea."]].map(function(a,i){return{n:i+1,brand:a[0],name:a[1],line:a[2]}});
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}
var grid=document.getElementById("grid");
function render(){
  var q=document.getElementById("q").value.trim().toLowerCase();
  var list=ADS.filter(function(a){return !q||(a.brand+" "+a.name+" "+a.line).toLowerCase().indexOf(q)>-1});
  document.getElementById("count").textContent=list.length+(list.length===1?" video ad":" video ads");
  if(!list.length){grid.innerHTML='<div class="empty">No ads match “'+esc(q)+'”. Try another word.</div>';return}
  grid.innerHTML=list.map(function(a){
    return '<button class="card" data-n="'+a.n+'"><div class="thumb"><b>'+esc(a.name)+'</b>'+
    '<img src="thumbs/'+FOLDER+'/'+a.n+'.png" alt="" loading="lazy" onerror="this.remove()"><span class="play"></span></div>'+
    '<div class="body"><h3>'+esc(a.brand)+'</h3><p>'+esc(a.line)+'</p></div></button>';
  }).join("");
}
var dlg=document.getElementById("dlg"),player=document.getElementById("player");
grid.addEventListener("click",function(e){
  var b=e.target.closest(".card");if(!b)return;
  var a=ADS[+b.dataset.n-1];
  player.innerHTML='<video controls autoplay playsinline src="videos/'+FOLDER+'/'+a.n+'.mp4"></video>';
  player.firstChild.onerror=function(){player.innerHTML='<div><span>Add <b>videos/'+FOLDER+'/'+a.n+'.mp4</b> to play this ad.</span></div>'};
  document.getElementById("dt").textContent=a.brand+": "+a.name;
  document.getElementById("dd").textContent=a.line;
  if(dlg.showModal)dlg.showModal();else dlg.setAttribute("open","");
});
function stop(){player.innerHTML="";dlg.close()}
document.getElementById("close").addEventListener("click",stop);
dlg.addEventListener("click",function(e){if(e.target===dlg)stop()});
dlg.addEventListener("cancel",function(){player.innerHTML=""});
document.getElementById("q").addEventListener("input",render);
render();
</script>
</body>
</html>
